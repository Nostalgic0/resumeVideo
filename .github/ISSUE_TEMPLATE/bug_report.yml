name: Bug Report
description: Report a bug to help us improve
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open app
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. Windows 11, macOS 14, Ubuntu 22.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      description: From Settings or the sidebar footer
  - type: textarea
    id: logs
    attributes:
      label: Console Logs
      description: Developer console output (open with Ctrl+Shift+I)
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues
          required: true
        - label: I have included all relevant information
          required: true
